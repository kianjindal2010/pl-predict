[project]
name = "pl-predict"
version = "0.1.0"
description = "Research-grade Premier League match prediction engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "polars>=0.20",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "scipy>=1.10",
    "numba>=0.58",
    "torch>=2.1",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "typer>=0.9",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pl-predict = "pl_predict.cli:main"
predict-pl = "pl_predict.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
